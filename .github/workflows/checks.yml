name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and checker
        run: python -m pip install -e . ruff
      - name: Unit and contract checks
        run: python -m unittest discover -s tests -v
      - name: Static checks
        run: ruff check src tests scripts benchmarks/fixtures
      - name: Command starts
        run: cobalt --help
