[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cobalt-agent"
version = "0.1.0"
description = "A local coding agent that makes its actions and verification visible"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cobalt = "cobalt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
